name: Build All Platforms

on:
  push:
    branches: ['main']
    tags: ['v*.*.*']
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: true
        type: boolean
      draft:
        description: 'Create as draft release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-all:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Configure Git to use HTTPS instead of SSH
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://".insteadOf "git://"

      - name: Setup npm config for CI
        run: |
          cat > .npmrc << 'EOF'
          registry=https://registry.npmjs.org/
          @jsr:registry=https://npm.jsr.io
          git-depth=1
          prefer-offline=false
          EOF
          echo "✅ CI npmrc configuration:"
          cat .npmrc

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: macos-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            macos-pnpm-store-

      - name: Cache Whisper model
        id: cache-whisper
        uses: actions/cache@v4
        with:
          path: electron/models/ggml-small.bin
          key: whisper-model-ggml-small-v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Whisper model
        if: steps.cache-whisper.outputs.cache-hit != 'true'
        run: |
          mkdir -p electron/models
          echo "📥 Downloading Whisper model (ggml-small.bin) - 465MB..."
          curl -L --progress-bar -o electron/models/ggml-small.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin
          echo "✅ Model downloaded successfully"
          ls -lh electron/models/

      - name: Verify Whisper model
        run: |
          if [ -f electron/models/ggml-small.bin ]; then
            echo "✅ Whisper model ready: $(ls -lh electron/models/ggml-small.bin | awk '{print $5}')"
          else
            echo "❌ Whisper model not found!"
            exit 1
          fi

      - name: Get package version
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('./package.json','utf8')).version;
            core.setOutput('version', version);
            return version;

      - name: Build All Platforms
        run: pnpm run electron:build:all
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Display build artifacts
        run: |
          echo "📦 Build artifacts:"
          ls -lh dist/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            dist/**/*.dmg
            dist/**/*.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-artifacts
          path: |
            dist/**/*.exe
            dist/**/*.msi
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-artifacts
          path: |
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.rpm
          retention-days: 30
          if-no-files-found: warn

  create-release:
    needs: build-all
    runs-on: ubuntu-latest
    if: >
      always() &&
      needs.build-all.result == 'success' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/') ||
       github.event.inputs.create_release == 'true')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get package version and tag info
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('./package.json','utf8')).version;
            let tagName, isPrerelease = false;
            if (context.ref.startsWith('refs/tags/')) {
              tagName = context.ref.replace('refs/tags/','');
              isPrerelease = /beta|alpha|rc/i.test(tagName);
            } else if (context.ref === 'refs/heads/main') {
              tagName = `v${version}`;
            } else {
              tagName = `v${version}-build-${context.runNumber}`;
              isPrerelease = true;
            }
            core.setOutput('version', version);
            core.setOutput('tag_name', tagName);
            core.setOutput('is_prerelease', isPrerelease);

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display downloaded artifacts
        run: |
          echo "📦 Downloaded artifacts:"
          find ./artifacts -type f -name "*" | sort
          echo ""
          echo "📊 File sizes:"
          find ./artifacts -type f -exec ls -lh {} \; | awk '{print $5, $9}'

      - name: Organize & rename artifacts
        run: |
          set -e
          VERSION='${{ steps.version.outputs.version }}'
          mkdir -p ./release-files/{macos,windows,linux}

          # macOS - x64
          MAC_DMG_X64=$(find ./artifacts -name "*-x64.dmg" | head -n 1 || echo "")
          if [ -n "$MAC_DMG_X64" ] && [ -f "$MAC_DMG_X64" ]; then
            cp "$MAC_DMG_X64" "./release-files/macos/rwkv-vtuber_${VERSION}_mac_x64.dmg"
            echo "✅ Found macOS x64 DMG: $MAC_DMG_X64"
          fi

          # macOS - arm64
          MAC_DMG_ARM64=$(find ./artifacts -name "*-arm64.dmg" | head -n 1 || echo "")
          if [ -n "$MAC_DMG_ARM64" ] && [ -f "$MAC_DMG_ARM64" ]; then
            cp "$MAC_DMG_ARM64" "./release-files/macos/rwkv-vtuber_${VERSION}_mac_arm64.dmg"
            echo "✅ Found macOS arm64 DMG: $MAC_DMG_ARM64"
          fi

          # Windows
          WIN_EXE=$(find ./artifacts -name "*.exe" ! -name "*Uninstall*" | head -n 1 || echo "")
          if [ -n "$WIN_EXE" ] && [ -f "$WIN_EXE" ]; then
            cp "$WIN_EXE" "./release-files/windows/rwkv-vtuber_${VERSION}_windows_x64.exe"
            echo "✅ Found Windows EXE: $WIN_EXE"
          fi

          # Linux
          LINUX_APPIMAGE=$(find ./artifacts -name "*.AppImage" | head -n 1 || echo "")
          if [ -n "$LINUX_APPIMAGE" ] && [ -f "$LINUX_APPIMAGE" ]; then
            cp "$LINUX_APPIMAGE" "./release-files/linux/rwkv-vtuber_${VERSION}_linux_x64.AppImage"
            echo "✅ Found Linux AppImage: $LINUX_APPIMAGE"
          fi

          echo "📁 Final organized release files:"
          find ./release-files -type f | sort

      - name: Generate checksums
        run: |
          cd ./release-files
          find . -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" \) -exec sha256sum {} \; > ../SHA256SUMS.txt
          echo "🔐 Generated checksums:"
          cat ../SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: RWKV-VTuber ${{ steps.version.outputs.version }}
          body: |
            ## 🚀 RWKV-VTuber ${{ steps.version.outputs.version }}

            ### 📦 Downloads

            **🍎 macOS**
            - Intel (x64) DMG: `rwkv-vtuber_${{ steps.version.outputs.version }}_mac_x64.dmg`
            - Apple Silicon (arm64) DMG: `rwkv-vtuber_${{ steps.version.outputs.version }}_mac_arm64.dmg`
            - 根据你的 Mac 芯片类型选择对应版本

            **🪟 Windows (x64)**
            - EXE 安装程序: `rwkv-vtuber_${{ steps.version.outputs.version }}_windows_x64.exe`

            **🐧 Linux (x64)**
            - AppImage: `rwkv-vtuber_${{ steps.version.outputs.version }}_linux_x64.AppImage`

            ### ✨ 主要功能
            - 🎤 **本地 Whisper 语音识别**：支持中文及 99 种语言
            - 🔊 **TTS 文本转语音**：多种语音引擎支持
            - 💬 **AI 对话**：集成 RWKV 模型
            - 🎨 **Live2D 角色**：虚拟形象展示
            - 📱 **跨平台**：macOS、Windows、Linux 全支持

            ### 📋 Build Information
            - 🌿 Branch: `${{ github.ref_name }}`
            - ⏰ Build time: ${{ github.event.head_commit.timestamp || github.event.created_at }}
            - 📝 Commit: [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - 🏗️ Build number: `${{ github.run_number }}`

            ### 🔐 File Verification
            下载 `SHA256SUMS.txt` 文件来验证文件完整性。

            ### 💡 Installation Notes
            
            **🍎 macOS 安装说明**
            
            1. **下载 DMG 文件**
            
            2. **安装应用**：
               - 双击 DMG 文件打开
               - 将 rwkv-vtuber 拖拽到 Applications 文件夹
            
            3. **首次运行**：
               - 按住 Control 键点击应用图标
               - 选择"打开" → 在弹窗中再次点击"打开"
               - 或者在"系统偏好设置" → "安全性与隐私"中允许运行
            
            4. **如果提示"已损坏"**，在终端运行：
               ```bash
               sudo xattr -rd com.apple.quarantine /Applications/rwkv-vtuber.app
               ```
            
            **🪟 Windows 安装说明**
            - 下载 EXE 安装程序并运行
            - 如果 SmartScreen 提示警告，点击"更多信息"然后"仍要运行"
            
            **🐧 Linux 安装说明**
            - 下载 AppImage 文件
            - 添加执行权限：`chmod +x rwkv-vtuber_*.AppImage`
            - 运行：`./rwkv-vtuber_*.AppImage`

            ### 📦 Whisper 模型说明
            
            应用内置 **ggml-small.bin** 中文多语言模型：
            - 支持中文及 99 种语言
            - 模型大小：487MB
            - 完全本地运行，无需联网
            - 首次启动会自动加载模型

            ### 📋 Changelog
            查看 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) 了解详细更新内容。
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          files: |
            ./release-files/**/*
            ./SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload organized artifacts for backup
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            ./release-files/**/*
            ./SHA256SUMS.txt
          retention-days: 90

  pr-summary:
    needs: build-all
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && always()
    
    steps:
      - name: PR Build Summary
        uses: actions/github-script@v7
        with:
          script: |
            const buildResult = '${{ needs.build-all.result }}';
            const success = buildResult === 'success';
            
            const summary = success 
              ? '✅ **Build Successful** - All platforms built successfully!'
              : '❌ **Build Failed** - Check the build logs for details.';
            
            const details = `
            ## 🏗️ Build Summary
            
            ${summary}
            
            ### 📦 Platforms Built
            - 🍎 macOS (Universal)
            - 🪟 Windows (x64)
            - 🐧 Linux (x64)
            
            ### ✨ Features Included
            - 🎤 Local Whisper speech recognition (Chinese + 99 languages)
            - 🔊 TTS text-to-speech
            - 💬 AI conversation with RWKV
            - 🎨 Live2D character support
            
            ### 📋 Next Steps
            ${success 
              ? '- Merge this PR to trigger a release build\n- The release will be created automatically after merge' 
              : '- Fix the build errors and push again\n- Check the Actions tab for detailed error logs'
            }
            `;
            
            console.log(details);
            core.summary.addRaw(details);
            await core.summary.write();

