name: Build Windows

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Configure Git
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://".insteadOf "git://"
          git config --global core.longpaths true

      - name: Setup npm config for CI
        shell: pwsh
        run: |
          @"
          registry=https://registry.npmjs.org/
          @jsr:registry=https://npm.jsr.io
          git-depth=1
          prefer-offline=false
          strict-peer-dependencies=false
          shamefully-hoist=true
          "@ | Out-File -FilePath .npmrc -Encoding utf8
          Write-Host "✅ CI npmrc configured"

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: pwsh
        run: |
          $storePath = pnpm store path --silent
          "STORE_PATH=$storePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: windows-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            windows-pnpm-

      - name: Install dependencies
        shell: pwsh
        run: |
          Write-Host "📦 Installing dependencies..."
          pnpm install --no-frozen-lockfile
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Dependency installation failed"
            exit 1
          }
          Write-Host "✅ Dependencies installed successfully"

      - name: Get package version
        id: version
        shell: pwsh
        run: |
          $pkg = Get-Content -Path "package.json" -Raw | ConvertFrom-Json
          $version = $pkg.version
          Write-Host "Package version: $version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Compile TypeScript
        shell: pwsh
        run: |
          Write-Host "🔨 Compiling TypeScript..."
          pnpm tsc -p electron/tsconfig.json
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ TypeScript compilation failed"
            exit 1
          }
          Write-Host "✅ TypeScript compiled successfully"

      - name: Build Vite frontend
        shell: pwsh
        run: |
          Write-Host "🏗️ Building Vite frontend..."
          pnpm run build
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Vite build failed"
            exit 1
          }
          Write-Host "✅ Vite build completed"

      - name: Build Electron App (Windows)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "⚙️ Building Electron app for Windows..."
          Write-Host "Version: $env:VERSION"

          # 执行构建 - 只在 tag 推送时发布
          if ("${{ github.ref }}" -like "refs/tags/*") {
            Write-Host "📦 Building and publishing to GitHub Release..."
            pnpm electron-builder --win --x64 --publish always
          } else {
            Write-Host "📦 Building without publishing..."
            pnpm electron-builder --win --x64 --publish never
          }

          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Electron build failed"
            exit 1
          }

          Write-Host "✅ Electron build completed"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-build
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.yml
          retention-days: 30
          if-no-files-found: error
          compression-level: 6

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.yml
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
