name: Build Windows

on:
  push:
    branches: ['main']
    tags: ['v*.*.*']
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Configure Git
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://".insteadOf "git://"
          git config --global core.longpaths true

      - name: Setup npm config for CI
        shell: pwsh
        run: |
          @"
          registry=https://registry.npmjs.org/
          @jsr:registry=https://npm.jsr.io
          git-depth=1
          prefer-offline=false
          strict-peer-dependencies=false
          shamefully-hoist=true
          "@ | Out-File -FilePath .npmrc -Encoding utf8
          Write-Host "✅ CI npmrc configuration:"
          Get-Content .npmrc

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: pwsh
        run: |
          $storePath = pnpm store path --silent
          Write-Host "PNPM Store Path: $storePath"
          "STORE_PATH=$storePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: windows-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            windows-pnpm-

      - name: Cache Whisper model
        id: cache-whisper
        uses: actions/cache@v4
        with:
          path: electron/models/ggml-small.bin
          key: whisper-model-small-v1

      - name: Install dependencies
        shell: pwsh
        run: |
          Write-Host "📦 Installing dependencies..."
          pnpm install --frozen-lockfile --prefer-offline
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Dependency installation failed"
            exit 1
          }
          Write-Host "✅ Dependencies installed successfully"

      - name: Download Whisper model
        if: steps.cache-whisper.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "electron/models" | Out-Null
          Write-Host "📥 Downloading Whisper model (ggml-small.bin) - 465MB..."
          $ProgressPreference = 'SilentlyContinue'
          try {
            Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin" -OutFile "electron/models/ggml-small.bin" -TimeoutSec 600
            Write-Host "✅ Model downloaded successfully"
          } catch {
            Write-Host "❌ Model download failed: $_"
            exit 1
          }

      - name: Verify Whisper model
        shell: pwsh
        run: |
          if (Test-Path "electron/models/ggml-small.bin") {
            $fileSize = (Get-Item "electron/models/ggml-small.bin").Length / 1MB
            Write-Host "✅ Whisper model verified: $([math]::Round($fileSize, 2)) MB"
            if ($fileSize -lt 400) {
              Write-Host "❌ Model file is too small, might be corrupted"
              exit 1
            }
          } else {
            Write-Host "❌ Whisper model not found!"
            exit 1
          }

      - name: Get package version
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('./package.json','utf8'));
            const version = pkg.version;
            console.log(`Package version: ${version}`);
            core.setOutput('version', version);
            return version;

      - name: Compile TypeScript
        shell: pwsh
        run: |
          Write-Host "🔨 Compiling TypeScript..."
          pnpm tsc -p electron/tsconfig.json
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ TypeScript compilation failed"
            exit 1
          }
          Write-Host "✅ TypeScript compiled successfully"

      - name: Copy native files and models
        shell: pwsh
        run: |
          Write-Host "📦 Copying native files and models..."
          
          # 创建目标目录
          New-Item -ItemType Directory -Force -Path "dist-electron/native/whisper" | Out-Null
          New-Item -ItemType Directory -Force -Path "dist-electron/models" | Out-Null
          
          # 复制 native whisper 文件（Windows 使用 .node 文件）
          if (Test-Path "electron/native/whisper") {
            Copy-Item -Path "electron/native/whisper/*" -Destination "dist-electron/native/whisper/" -Recurse -Force -ErrorAction Stop
            Write-Host "✅ Copied native whisper files"
            Get-ChildItem "dist-electron/native/whisper/" | ForEach-Object { Write-Host "  - $($_.Name)" }
          } else {
            Write-Host "⚠️ Warning: electron/native/whisper not found"
          }
          
          # 复制 Whisper model
          if (Test-Path "electron/models/ggml-small.bin") {
            Copy-Item -Path "electron/models/ggml-small.bin" -Destination "dist-electron/models/" -Force -ErrorAction Stop
            Write-Host "✅ Copied Whisper model"
            $modelSize = (Get-Item "dist-electron/models/ggml-small.bin").Length / 1MB
            Write-Host "  - ggml-small.bin: $([math]::Round($modelSize, 2)) MB"
          } else {
            Write-Host "❌ Whisper model not found!"
            exit 1
          }
          
          # 注意：Sherpa-ONNX 模型不打包，由用户自行下载配置
          Write-Host "ℹ️  Sherpa-ONNX 模型需用户自行下载配置"
          
          # 验证文件结构
          Write-Host "`n📁 dist-electron structure:"
          Get-ChildItem -Path "dist-electron" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Build Vite frontend
        shell: pwsh
        run: |
          Write-Host "🏗️ Building Vite frontend..."
          pnpm run build
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Vite build failed"
            exit 1
          }
          Write-Host "✅ Vite build completed"
          Write-Host "`n📁 dist/ contents:"
          Get-ChildItem -Path "dist" -Recurse | Select-Object FullName | Format-Table -AutoSize

      - name: Build Electron App (Windows)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          Write-Host "⚙️ Building Electron app for Windows..."
          Write-Host "Version: ${{ steps.version.outputs.version }}"
          
          # 显示环境信息
          Write-Host "`n📋 Build environment:"
          Write-Host "  - Node: $(node --version)"
          Write-Host "  - npm: $(npm --version)"
          Write-Host "  - pnpm: $(pnpm --version)"
          Write-Host "  - electron-builder: $(npx electron-builder --version)"
          
          # 执行构建
          pnpm electron-builder --win --x64
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Electron build failed"
            exit 1
          }
          
          Write-Host "✅ Electron build completed"
          Write-Host "`n📦 Build artifacts:"
          Get-ChildItem -Path "dist" -Filter "*.exe" -Recurse | ForEach-Object {
            $size = $_.Length / 1MB
            Write-Host "  - $($_.Name): $([math]::Round($size, 2)) MB"
          }

      - name: List all build outputs
        shell: pwsh
        run: |
          Write-Host "📋 All files in dist/ directory:"
          Get-ChildItem -Path "dist" -Recurse | Where-Object { -not $_.PSIsContainer } | Select-Object FullName, @{N='Size(MB)';E={[math]::Round($_.Length/1MB, 2)}} | Format-Table -AutoSize

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.yml
          retention-days: 30
          if-no-files-found: error
          compression-level: 6

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.exe.blockmap
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

